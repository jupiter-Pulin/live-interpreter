<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap">
  <style>
    body { margin: 0; background: #0e0f12; color: #edeff3; font-family: "IBM Plex Sans", -apple-system, "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #e6b45a; text-decoration: none; }
    a:hover { color: #f0c97a; }
    button { font-family: inherit; cursor: pointer; }
    .mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }
  </style>
</helmet>
<div style="width: 380px; min-height: 640px; background: #0e0f12; display: flex; flex-direction: column; align-items: stretch;">
  <div style="display: flex; flex-direction: column; background: #17191d; border: 1px solid #2a2e36; border-radius: 12px; box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45); overflow: hidden;">

    <div style="display: flex; align-items: center; gap: 10px; padding: 12px 12px 12px 8px; border-bottom: 1px solid #2a2e36;">
      <a href="#" style="width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #9aa3b0;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
      </a>
      <div style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1; min-width: 0;">
        <div style="font-size: 14px; font-weight: 600;">音频路由</div>
        <div style="font-size: 11px; color: #6b7380;">第一次使用需要两块 BlackHole 虚拟声卡</div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px; padding: 14px 16px 0;">
      <div style="font-size: 11px; color: #6b7380; letter-spacing: 0.04em; padding: 0 2px;">设备角色</div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 10px; background: #1f2228; border: 1px solid #2a2e36;">
        <div style="width: 32px; height: 32px; border-radius: 8px; background: rgba(79, 214, 184, 0.14); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4fd6b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18.5 5.5a9 9 0 0 1 0 13"></path></svg>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0;">
          <div style="font-size: 13px; font-weight: 500;">会议声音 · 截获</div>
          <div style="font-size: 12px; color: #9aa3b0;">会议 app 的输出先进这里</div>
        </div>
        <div style="display: flex; align-items: center; gap: 6px; flex-shrink: 0;">
          <div style="font-size: 12px; color: #edeff3;">BlackHole 2ch</div>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6b7380" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 10px; background: #1f2228; border: 1px solid #2a2e36;">
        <div style="width: 32px; height: 32px; border-radius: 8px; background: rgba(79, 214, 184, 0.14); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4fd6b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15v-3a8 8 0 0 1 16 0v3"></path><rect x="3" y="14" width="4" height="6" rx="1.5"></rect><rect x="17" y="14" width="4" height="6" rx="1.5"></rect></svg>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0;">
          <div style="font-size: 13px; font-weight: 500;">你的耳机 · 监听</div>
          <div style="font-size: 12px; color: #9aa3b0;">中文译音从这里播出</div>
        </div>
        <div style="display: flex; align-items: center; gap: 6px; flex-shrink: 0;">
          <div style="font-size: 12px; color: #edeff3;">AirPods Pro</div>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6b7380" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 10px; background: #1f2228; border: 1px solid #2a2e36;">
        <div style="width: 32px; height: 32px; border-radius: 8px; background: rgba(230, 180, 90, 0.14); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#e6b45a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3"></path></svg>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0;">
          <div style="font-size: 13px; font-weight: 500;">你的麦克风</div>
          <div style="font-size: 12px; color: #9aa3b0;">你的中文原声</div>
        </div>
        <div style="display: flex; align-items: center; gap: 6px; flex-shrink: 0;">
          <div style="font-size: 12px; color: #edeff3;">MacBook Pro 麦克风</div>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6b7380" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 10px; background: #1f2228; border: 1px solid rgba(240, 122, 104, 0.5);">
        <div style="width: 32px; height: 32px; border-radius: 8px; background: rgba(240, 122, 104, 0.14); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f07a68" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l10 18H2z"></path><path d="M12 10v4"></path><path d="M12 17.5v0.5"></path></svg>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1; min-width: 0;">
          <div style="font-size: 13px; font-weight: 500;">虚拟麦克风 · 送进会议</div>
          <div style="font-size: 12px; color: #9aa3b0;">会议里把麦克风选成它</div>
        </div>
        <div style="display: flex; align-items: center; gap: 6px; flex-shrink: 0;">
          <div style="font-size: 12px; color: #f07a68;">未检测到</div>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6b7380" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
        </div>
      </div>
    </div>

    <div style="padding: 12px 16px 0;">
    <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-radius: 10px; background: rgba(230, 180, 90, 0.08); border: 1px solid rgba(230, 180, 90, 0.25);">
      <div style="font-size: 12px; line-height: 1.55; color: #c5cbd4;">缺少 BlackHole 16ch。装好后，在会议 app 里把扬声器选成「多输出设备」，麦克风选成 BlackHole 16ch。</div>
      <a href="#" style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500;">
        <span>安装 BlackHole 16ch</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7"></path><path d="M8 7h9v9"></path></svg>
      </a>
    </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px; padding: 16px;">
      <button style="height: 40px; border-radius: 8px; border: 1px solid #2a2e36; background: #23262c; color: #6b7380; font-size: 13px; font-weight: 500; cursor: default;">开始同传</button>
      <div style="font-size: 11px; color: #6b7380; text-align: center;">先完成虚拟麦克风设置</div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
