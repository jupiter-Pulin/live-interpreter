<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>live-interpreter 个人同传</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: -apple-system, "PingFang SC", sans-serif; background: #14161a; color: #e8e8e8; margin: 0; padding: 24px; }
  h1 { font-size: 18px; margin: 0 0 16px; }
  .panel { background: #1d2026; border: 1px solid #2c313a; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .panel h2 { font-size: 14px; margin: 0 0 12px; color: #9fb3c8; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  label { font-size: 13px; color: #aab; min-width: 12em; }
  select { background: #12141a; color: #e8e8e8; border: 1px solid #333a45; border-radius: 6px; padding: 6px 8px; max-width: 22em; }
  button { background: #2b5cb8; color: #fff; border: 0; border-radius: 6px; padding: 8px 16px; cursor: pointer; font-size: 14px; }
  button.stop { background: #7a3030; }
  button.muted { background: #555c66; }
  .status { font-size: 12px; color: #8fa; }
  #subtitle-current { font-size: 22px; line-height: 1.5; min-height: 2em; }
  #subtitle-history { font-size: 14px; color: #99a; max-height: 10em; overflow-y: auto; white-space: pre-line; }
  #latency { font-variant-numeric: tabular-nums; }
  #error-area { color: #ff8a80; font-size: 14px; min-height: 1.5em; }
</style>
</head>
<body>
<h1>live-interpreter — 个人同传（<span id="backend-label">…</span> 后端）</h1>

<div class="panel">
  <h2>设备角色</h2>
  <div class="row"><label>capture（BlackHole 截获会议音）</label><select id="sel-capture"></select></div>
  <div class="row"><label>monitor（你的耳机）</label><select id="sel-monitor"></select></div>
  <div class="row"><label>mic（真麦克风）</label><select id="sel-mic"></select></div>
  <div class="row"><label>virtualMic（第二块 BlackHole）</label><select id="sel-virtualMic"></select></div>
</div>

<div class="panel">
  <h2>下行 · 对方英语 → 你听中文</h2>
  <div class="row">
    <button id="btn-downlink">启动下行</button>
    <span class="status" id="status-downlink">已停止</span>
    <span>延迟 <span id="latency">—</span></span>
  </div>
  <div id="subtitle-current"></div>
  <div id="subtitle-history"></div>
</div>

<div class="panel">
  <h2>上行 · 你说中文 → 对方听英语</h2>
  <div class="row">
    <button id="btn-uplink">启动上行</button>
    <button id="btn-mute" class="muted">已静音（点击开始翻译）</button>
    <span class="status" id="status-uplink">已停止</span>
  </div>
</div>

<div class="panel">
  <h2>提示</h2>
  <div id="error-area"></div>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>
